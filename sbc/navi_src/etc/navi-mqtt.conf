# navi-mqtt.conf — Rock 5A 로컬 MQTT 브로커
#
# 배치: /etc/mosquitto/conf.d/navi.conf
#
# 브로커를 상위 IPC 가 아니라 **로봇에 둔다.**
#   · IPC 를 직결하든 무선으로 붙든 접속점이 하나다
#   · IPC 가 꺼져 있어도 로봇은 자기 상태를 계속 발행한다 (재접속하면 바로 최신값)
#   · navi 는 127.0.0.1 로 붙으므로 네트워크가 끊겨도 내부 동작에 영향이 없다
#
# ⚠ mosquitto 2.x 는 기본이 로컬 전용(127.0.0.1)이다. 명시적으로 열어야 외부에서 붙는다.

# 유선·무선 어느 쪽으로 붙어도 되게 모든 인터페이스에서 받는다.
# (유/무선을 선택해서 쓰므로 특정 인터페이스에 묶지 않는다)
listener 1883 0.0.0.0

# 폐쇄망(로봇 ↔ IPC 직결) 전제라 인증을 걸지 않는다.
# 🔴 외부망에 노출되는 구성으로 바뀌면 반드시 아래를 켤 것:
#     allow_anonymous false
#     password_file /etc/mosquitto/passwd     ( mosquitto_passwd -c ... 로 생성 )
allow_anonymous true

# 브라우저에서 직접 붙을 일이 생기면 WebSocket 리스너를 쓴다 (지금은 불필요)
# listener 9001 0.0.0.0
# protocol websockets

# ⚠ persistence / persistence_location / log_dest 는 여기 쓰지 말 것.
#   /etc/mosquitto/mosquitto.conf 에 이미 있고, **중복 지정하면 기동이 실패한다**
#   (`Error found at ...navi.conf:28` → status=3). conf.d 는 덮어쓰기가 아니라 추가다.

# 로봇 한 대 + IPC 몇 대 규모다. 큐를 크게 잡을 이유가 없다.
max_queued_messages 200
message_size_limit 262144
