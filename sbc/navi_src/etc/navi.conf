# navi.conf — 현장에서 바뀌는 값. navi 가 시작할 때 읽는다 (없으면 config.hpp 기본값).
#
# 재빌드 없이 고칠 수 있다. 값을 바꾼 뒤 navi 를 다시 띄우면 반영된다.
#   navi 실행 경로에 두거나, NAVI_CONF=/경로/navi.conf 로 지정
#
# 형식:  키 = 값     (# 뒤는 주석, 빈 줄 무시)

# ── 구동 모터 ────────────────────────────────────────────────────
# ── RS485 ───────────────────────────────────────────────────────
# 🔴 보드를 바꾸면 de_chip / de_line 이 달라진다. 반드시 실측할 것:
#       gpiofind PIN_12
#    ROCK 3A (RK3568)  → gpiochip3 line 3   (GPIO3_A3)
#    ROCK 5A (RK3588S) → gpiochip4 line 1   (GPIO4_A1)
#    칩 번호는 뱅크 번호와 같다는 보장이 없다(커널 프로브 순서를 따른다).
# ── 경로가 둘이다. 보드에 두 구성이 이름 붙여 보관돼 있고 복사만 하면 바뀐다:
#      /opt/navi/navi.conf.hat   ← ttyS2  + gpiochip4  (HAT 온보드. **현재 이것 · 정상**)
#      /opt/navi/navi.conf.usb   ← ttyUSB0 + none      (USB-485 동글. 차선책)
#    바꾸는 법:  sudo cp /opt/navi/navi.conf.usb /opt/navi/navi.conf && sudo systemctl restart navi
#    ⚠ 그보다 오래된 navi.conf.usb485 / bak-ch340 은 **복원하지 말 것** — 없어진
#      by-id 경로가 박혀 있어 `포트 열기 실패` 로 구동계가 통째로 내려간다.
#
# ✅ 이력: 2026-09-03 HAT 경로로 4축 전부 무응답 → "트랜시버 고장" 으로 보고 동글로
#   우회했다. **그 판정은 틀렸다.** 09-21 에 485선을 새로 만드니 HAT 경로가 그대로
#   살아났다(4축 전부, 깨짐 0/160). 범인은 내내 **배선**이었다.
#   🔴 교훈: "전 축 무응답" 에서 마스터(보드·트랜시버)를 범인으로 지목하기 전에
#      **배선을 통째로 새로 만들어 보는 것**이 가장 싸고 결정적인 시험이다.
#      한 달 동안 DE 타이밍·GPIO·EEPROM·전원을 다 뒤졌지만 전부 하류였다.
rs485_port   = /dev/ttyS2     # HAT 온보드 RS485 (40핀 8/10 = UART2)
de_chip      = gpiochip4      # HAT 은 DE GPIO 필요. 보드 바뀌면 gpiofind PIN_12 로 실측
de_line      = 1              # ← 5A 기준 (de_chip=none 이면 무시된다)
rs485_baud   = 115200
#
#   진단(navi 를 **반드시 멈추고**):
#     HAT 경로:  nuri_ping.py --scan
#     동글 경로: nuri_ping.py --port /dev/ttyUSB0 --no-de --scan
#
#   🔴 동글 경로에서는 **by-id 를 쓰지 않는다**. 동글은 교체 부품이고 by-id 에는
#     제조사·시리얼이 박혀 있어 바꿔 끼우면 조용히 죽는다(2026-09-21 실제 발생).
#     이 보드의 USB 시리얼은 하나뿐이라(열화상은 cdc_acm = ttyACM0) ttyUSB0 이 안정적이다.
#
#   ✅ 2026-09-21 해결: **동글 불량이었다.** 485선과 동글을 동시에 갈고 4축 전부
#     무응답이 됐는데, 배선은 멀쩡했고 FT232R 어댑터(시리얼 A50285BI) 자체가 죽어
#     있었다. 같은 칩의 다른 개체(A9473SK1)로 바꾸니 즉시 4축 전부 응답.
#
#     🔴 **교훈: 동글을 먼저 의심하라.** 이 증상들은 전부 동글 불량으로 나온 것이다
#        — 115200 에서만 오는 `00 00 00 00 f8` 쓰레기, 그 뒤의 완전 무음, RTS·DTR
#        양 극성 무반응. 나는 이걸 "A/B 극성 반전" 으로 읽었다가 무음을 다시
#        "극성이 맞아졌다" 로 읽었다 — **같은 근거를 반대로 두 번 읽었다.**
#        선과 동글을 동시에 갈면 원격 시험은 전부 두 변수의 하류라 못 가른다.
#        **한 번에 하나만 바꿔서 가를 것.**
#
#     ✅ 그리고 이걸로 CH340 때의 bit 7 깨짐도 설명된다 — 그것도 **동글 탓**이었다.
#        새 동글 실측: 축별 40회씩 160회 전부 OK(깨짐 0), 60초 폴링 비정상 0건.
#        CH340 은 ID1/2/4 ~7% · ID3 45% 깨졌고 RL 이 e-stop 을 래치했다.
#        → "죽은 HAT 트랜시버가 버스에 남아서" 가설은 **기각**. J3 분리 불필요.
#
#   ⚠ 남은 문제: 동글 경로에서 응답 프레임의 bit 7 이 ~7%(RL 은 45%) 1 로
#     뒤집힌다 (size 0x08→0x88, CS 0xA3→0x23). 마지막 데이터 비트만 깨지는 건
#     바이트 끝에서 라인이 low 를 못 붙드는 것이다. 죽은 HAT 트랜시버가 같은
#     버스에 병렬로 남아 있는 것이 첫 의심 → **J3 를 분리하고 재측정할 것.**
#     그래도 남으면 동글의 종단저항(120Ω 점퍼)을 본다.
#     체크섬이 걸러내고 motor_fail_limit(5) 안에서 회복되므로 주행은 되지만,
#     RL 은 실패율이 높아 e-stop 이 간헐적으로 래치된다.

# ── 작업등 (12V LED ×3) ───────────────────────────────────────────
# HAT 의 Q3 를 GPIO 한 줄로 스위칭한다. **3채널 일괄** — 회로상 개별 제어 불가.
# 배선(2026-09-03 실측): 12V IO 3선을 J4·J5·J7 에 하나씩. gpiochip1:5 = 40핀 16번.
# 🔴 보드를 바꾸면 실측할 것:  gpiofind PIN_16
#    확인 방법(navi 를 멈추고):  sudo gpioset --mode=time --sec=3 gpiochip1 5=1
led_chip     = gpiochip1
led_line     = 5
# 기동과 함께 켠다 — 상시 점등 (사용자 결정 2026-09-03).
# 끄고 싶으면 0. 런타임 제어는 `cmd/led {"on":true|false}` 로도 된다
# (워치독 대상이 아니라 유지 발행 불필요, e-stop 중에도 켜진다).
led_on_boot  = 1
# 🔴 보드마다 다르다. 이 값이 틀리면 RS485 만 문제가 아니다 — tick 전체가 밀려
#    열화상이 -273℃(오류값)로 나오고 tick 이 41ms 로 늘어난다.
#    모터가 잘 돈다고 이 값이 맞는 게 아니다.
#
# 200 → 300 (2026-09-21 실측). 축별 guard 스윕 결과 (115200, 20회씩):
#        150µs  ID1 20/20  ID2 20/20  ID3  0/20  ID4 20/20   ← ID3 만 벼랑 아래
#        200µs ~ 500µs     4축 전부 20/20
#    ID3(RL) 이 유독 빠듯하다. 200 은 안전구간의 **아래 끝**이라 300(구간 한가운데,
#    nuri_ping 실측 권장값)으로 올렸다. 위쪽 한계도 있다 — 800µs 부터는 모터 응답의
#    첫 바이트가 잘린다(nurirobot.hpp send() 주석). 다시 재려면 --de-sweep.
de_guard_us  = 300
gear_ratio   = 20.0
max_wheel_rpm = 150

# 휠 정의:  wheel = ID, 라벨, sign
#
#   sign 은 좌우 장착 방향 보정이다. **전진 명령에 네 바퀴가 같은 방향으로 굴러가도록**
#   실물을 보고 맞춘다. 보통 좌측 +1 / 우측 -1 이지만 모터를 어떻게 끼웠느냐에 달렸다.
#
#   맞추는 법:  sudo ./navi wheelcheck
#              축을 하나씩 천천히 돌려준다. 전진 방향으로 굴러가면 그대로,
#              반대로 굴러가면 그 축의 sign 을 뒤집어서 여기 저장하면 된다.
#
#   ⚠ 순서가 곧 FL FR RL RR 배치다. 운동학이 이 순서를 전제한다.
#      (bodyToWheels 가 [0]=FL [1]=FR [2]=RL [3]=RR 로 계산한다)
# 실물 장착 위치 (2026-08-07 확인). 없는 축을 적으면 한 축 실패 → 전 축 e-stop 이 걸린다.
#   2026-08-13: 모터 4대 교체 후 ID/감속비/보레이트 재부여 — 4축 전부 응답·회전 확인.
#   ID 는 배열 순서와 일치시켰다 (FL=1 FR=2 RL=3 RR=4).
#   sign: 2026-08-14 실주행에서 네 바퀴가 통째로 반대로 돌아 4개 전부 반전했다
#   (좌 +1/우 -1 → 좌 -1/우 +1). 조이스틱 전진·게걸음으로 확인함.
wheel = 1, FL, -1      # 왼쪽 앞
wheel = 2, FR, +1      # 오른쪽 앞
wheel = 3, RL, -1      # 왼쪽 뒤
wheel = 4, RR, +1      # 오른쪽 뒤

# ── HAT 리비전 ───────────────────────────────────────────────────
#
# 🔴 리비전에 따라 **홀 센서 핀이 다르다.** 틀리면 액추에이터는 도는데
#    홀 카운트만 0 이라(위치가 안 변하고 "스트로크끝단"으로 보인다) 원인을 찾기 어렵다.
#
#      V1  홀 핀35·31  → 5A 기준 gpiochip4:0 · gpiochip1:9  (칩이 서로 다르다)
#      V2  홀 핀38·40  → 5A 기준 gpiochip4:5 · gpiochip4:9
#
#    기동 배너에 어느 리비전으로 잡혔는지 찍힌다. 보드를 바꾸면 여기부터 고칠 것.
hat_rev = 2

# ── 차체 치수 (운동학) ───────────────────────────────────────────
# 0이면 setBodyVelocity/odometry 가 막힌다. 실측해서 채울 것.
wheel_radius_m = 0.0
track_width_m  = 0.0
wheel_base_m   = 0.0
slip_factor    = 1.0      # 스키드스티어 회전 보정. 제자리 회전 시켜보고 맞춘다

# ── 주기·안전 ────────────────────────────────────────────────────
tick_period_ms   = 20
# 500 → 800 (2026-09-03): 무선 거리가 멀 때 주행 중 워치독이 트립했다.
# IPC 는 350 ms 마다 발행하므로 500 이면 슬랙이 **150 ms 뿐**이다 — 영상(2Mbps)이
# 같은 무선을 쓰다 보니 명령이 큐 뒤에 밀리면 그걸 넘긴다.
# 800 이면 슬랙 450 ms (발행 주기의 2.3배). 통신이 진짜 죽으면 그만큼 늦게 서는데,
# 이 속도(0.02~0.05 m/s)에서 800 ms 는 **1.6~4 cm** 라 위험이 작다.
# ⚠️ 이래도 트립하면 공백이 450 ms 를 넘는다는 뜻 → 대역 경합 쪽을 봐야 한다
#    (video_fps/video_bps 낮추기, 제어 트래픽 우선순위).
watchdog_ms      = 800
# 평상시 정지 감속 시간(초). 0 이면 즉시 차단(뚝 선다).
# e-stop·워치독은 이 값과 무관하게 항상 즉시 차단이다.
decel_secs       = 0.8
poll_timeout_ms  = 40     # 실측 왕복 21ms + 여유
motor_fail_limit = 5

# 🔴 과전류 보호 — 2026-08-07 모터 4대를 태우고 넣었다.
#    전자 브레이크(무여자 작동형)를 안 풀고 돌려서 무부하인데 정격 2.7A 의 6~9배가 흘렀다.
#    모터 내장 보호(15A 퓨즈)는 걸리지 않았다 — 믿지 말 것.
#      지령  5 RPM →  0.2A 정상 /  10 RPM → 17.3A / 20 RPM → 25.4A 포화 후 소손
#    중앙값이 임계를 연속 N회 넘으면 e-stop. 전류는 순간 피크라 중앙값으로 판정한다.
overcurrent_a    = 10.0   # 5.0→10.0 (2026-08-14): 정상 무부하 중앙값 1.4A · 스톨 ~15A 사이. window 15 로도 5.2A 오트립 발생
overcurrent_hits = 3
current_window   = 15   # 5→15 (2026-08-14): 400ms 창은 스파이크 3개만 몰려도 오트립한다

# ── MQTT ─────────────────────────────────────────────────────────
mqtt_host   = 127.0.0.1   # ← 상위 서버 주소로 교체
mqtt_port   = 1883
mqtt_prefix = navi

# ── 프레임 전송 (초당 N장) ───────────────────────────────────────
# 상위가 cmd/stream 으로 켠다. 아무도 안 보는데 흘리면 대역폭만 먹는다.
#   mosquitto_pub -t navi/cmd/stream -m '{"on":true,"fps":10}'
#
# ⚠ 큰 이미지를 MQTT 로 밀면 브로커 큐가 밀린다.
#   열화상(80x60 BMP 14KB)은 10fps 에 140KB/s 라 감당되지만,
#   IR 1080p 는 그 10배가 넘는다 — IR 영상은 MediaMTX(RTSP/WebRTC)로 보낼 것.
stream_enabled = 0     # 부팅 시 자동 시작 여부
stream_fps     = 10
stream_thermal = 1     # 열화상 이미지
stream_ir      = 0     # IR 이미지 — 크다. 기본 끔

# ── ToF 거리센서 ────────────────────────────────────────────────
#
# 🔴 HAT 리비전에 따라 연결이 다르다. 보드를 교체하면 tof_i2c 를 함께 바꿀 것.
#      HAT V1  tof_i2c = 0   UART  40핀 7·29 (UART4_M2) → /dev/ttyS4
#      HAT V2  tof_i2c = 1   I2C   40핀 3·5 (I2C8_M2)   → /dev/i2c-8
#    I2C 를 쓰려면 커널 오버레이가 켜져 있어야 한다:
#      sudo mv /boot/dtbo/rk3588-i2c8-m2.dtbo.disabled /boot/dtbo/rk3588-i2c8-m2.dtbo
#      sudo u-boot-update && sudo reboot        확인: ls /dev/i2c-8
tof_enabled  = 1
tof_i2c      = 1             # ← V2. V1 로 되돌리면 0
tof_port     = /dev/ttyS4    # UART 일 때만 쓴다
tof_baud     = 115200
tof_i2c_dev  = /dev/i2c-8
tof_i2c_addr = 0x10          # TF-Luna 기본 슬레이브 주소
tof_i2c_period_ms = 10       # 폴링 주기. 센서 갱신이 100Hz 다
tof_min_strength = 100       # 이보다 낮으면 거리값을 못 믿는다 (데이터시트 권장)

# ── IR 영상 송출 (TCP <보드>:5000, H.264) ────────────────────────
# 🔴 2026-09-03 까지 이 키들이 **파싱되지 않았다**(매뉴얼 표 4-2 엔 있었다).
#    같은 날 프레임 감축 버그도 고쳤다 — 카메라 61fps 를 그대로 인코딩하면서
#    MPP 에는 30fps 라고 알려줘서 CBR 예산이 어긋나 **출력이 2배**였다
#    (목표 2Mbps, 실측 4Mbps). 지금은 실측 1.94Mbps 로 목표를 지킨다.
#
# 무선 거리가 멀어져 화면이 끊기면 **여기를 낮춘다** (재빌드 불필요, navi 재시작만):
#    끊김 심함  → video_fps 20 · video_bps 1200000
#    아주 멀다  → video_fps 15 · video_bps 800000
# fps 를 먼저 낮추는 게 낫다 — 같은 비트레이트에서 장당 예산이 늘어 화질이 유지된다.
video_port   = 5000
# 30/2Mbps → 20/1.2Mbps (2026-09-03): 신호 60% 거리에서 명령이 밀려 워치독 트립.
# 회복되면 다시 올려도 된다 — fps 를 먼저 올리는 게 화질에 유리하다.
video_fps    = 20
video_bps    = 1200000

# ── 카메라 ───────────────────────────────────────────────────────
thermal_enabled  = 1
# 🔴 TmSDK 를 쓸지. 0 = v4l2 로 직접 읽는다 (권장).
#    SDK Open() 이 UVC 장치를 점유하는데 정작 QueryFrame 은 블로킹된다 —
#    실측 40회에 1회 성공(frames 1 / drops 108).
#    v4l2 로 바꾸니 frames 107 / drops 1 / 7.8fps 로 정상이 됐다.
#    잃는 것: FFC(셔터보정)와 SDK 컬러맵 — 흑백으로 대체한다.
thermal_use_sdk  = 0
thermal_colormap = 2      # 2=Jet, 4=Rainbow, 1=Bone, -1=흑백
